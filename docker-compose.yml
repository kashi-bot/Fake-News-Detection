services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/truthlens
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: http://localhost:5173
      COOKIE_SECURE: "false"
      AI_PROVIDER: ${AI_PROVIDER:-heuristic}
      AI_API_KEY: ${AI_API_KEY:-}
      NEWS_PROVIDERS: ${NEWS_PROVIDERS:-mock}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      VITE_API_URL: http://localhost:4000/api
    ports: ["5173:80"]

volumes:
  mongo-data: